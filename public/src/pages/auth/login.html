<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080A14">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Login - Smart Expense Tracker</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../../../favicon.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tabler Icons Webfont -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <!-- CSS Design System -->
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/responsive.css">

  <!-- Supabase CDN Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: var(--color-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-4);
    }
    .auth-container {
      width: 100%;
      max-width: 420px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #12162A;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 18px;
      padding: var(--space-8) var(--space-6);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
    }
    .auth-header {
      text-align: center;
      margin-bottom: var(--space-6);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <img src="../../../assets/images/logo.png" onerror="this.onerror=null; this.src='/assets/images/logo.png';" alt="Smart Expense Logo" class="brand-logo-img" style="width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; object-fit: cover;">
          <span class="sidebar-brand">Smart Expense Tracker</span>
        </div>
        <h2>Welcome Back</h2>
        <p class="text-muted" style="font-size: var(--text-sm);">Log in to manage your daily expenses and budgets.</p>
      </div>

      <div id="auth-alert" class="hidden" style="padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #EF4444; font-size: var(--text-xs); margin-bottom: var(--space-4);"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="user@example.com" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="password">Password</label>
            <a href="forgot-password.html" class="text-primary" style="font-size: var(--text-xs);">Forgot password?</a>
          </div>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required style="padding-right: 48px;">
            <button type="button" id="btn-toggle-password" style="position: absolute; right: 12px; background: none; border: none; font-size: 1.15rem; color: var(--color-text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px;" aria-label="Toggle password visibility">
              <i class="ti ti-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">
          Sign In
        </button>
      </form>

      <div style="display: flex; align-items: center; margin: 20px 0;">
        <div style="flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1);"></div>
        <span style="padding: 0 12px; font-size: 12px; color: var(--color-text-muted);">OR</span>
        <div style="flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1);"></div>
      </div>

      <button type="button" id="btn-google-login" class="btn btn-secondary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; padding: 10px;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>

      <div style="text-align: center; margin-top: var(--space-6); font-size: var(--text-sm);" class="text-muted">
        Don't have an account? <a href="register.html" class="text-primary font-semibold">Sign Up</a>
      </div>
    </div>
  </div>

  <script type="module" src="../../js/auth/login.js"></script>
</body>
</html>
