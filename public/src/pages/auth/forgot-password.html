<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Smart Expense Tracker</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Design System -->
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/responsive.css">

  <!-- Supabase CDN Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      background: radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.18), #080A14 70%);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #12162A;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 18px;
      padding: var(--space-8) var(--space-6);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
    }
    .auth-header {
      text-align: center;
      margin-bottom: var(--space-6);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <img src="../../../assets/images/logo.png" onerror="this.onerror=null; this.src='/assets/images/logo.png';" alt="Smart Expense Logo" class="brand-logo-img" style="width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; object-fit: cover;">
          <span class="sidebar-brand">Smart Expense Tracker</span>
        </div>
        <h2>Reset Password</h2>
        <p class="text-muted" style="font-size: var(--text-sm);">Enter your account email to receive a password reset link.</p>
      </div>

      <div id="auth-alert" class="hidden" style="padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); font-size: var(--text-xs); margin-bottom: var(--space-4);"></div>

      <form id="reset-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="user@example.com" required>
        </div>

        <button type="submit" id="btn-reset" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">
          Send Reset Link
        </button>
      </form>

      <div style="text-align: center; margin-top: var(--space-6); font-size: var(--text-sm);" class="text-muted">
        Remembered your password? <a href="login.html" class="text-primary font-semibold">Back to Login</a>
      </div>
    </div>
  </div>

  <script type="module" src="../../js/auth/password-reset.js"></script>
</body>
</html>
