<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080A14">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Budgets - Smart Expense Tracker</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../../../favicon.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tabler Icons Webfont -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <!-- CSS Design System -->
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/responsive.css">

  <!-- Supabase CDN Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside id="app-sidebar"></aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Top Navbar -->
      <header id="app-navbar"></header>

      <!-- Main Content -->
      <main class="main-content">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Monthly Budget Manager</h1>
            <p class="text-muted">Set spending limits, monitor budget usage, and receive warning alerts.</p>
          </div>
          
          <div class="budget-header-controls" style="display: flex; gap: 12px; align-items: center;">
            <select id="budget-month-select" class="form-control" style="width: 140px;"></select>
            <select id="budget-year-select" class="form-control" style="width: 110px;"></select>
            <button id="btn-open-set-budget" class="btn btn-primary btn-sm"><i class="ti ti-settings"></i> Set Monthly Budget</button>
          </div>
        </div>

        <!-- Overall Budget Overview Card -->
        <div id="budget-overview-card-container" style="margin-bottom: var(--space-6);">
          <!-- Populated by budget-card.js -->
        </div>

        <!-- Set Budget Modal Backdrop -->
        <div id="modal-set-budget-backdrop" class="modal-backdrop">
          <div class="modal">
            <div class="modal-header">
              <h3 class="modal-title">Set Monthly Budget</h3>
              <button class="modal-close" data-modal-close>&times;</button>
            </div>
            <form id="form-set-budget">
              <div class="modal-body">
                <div id="budget-alert" class="hidden" style="padding: 10px 14px; background: var(--color-expense-light); color: var(--color-danger); border-radius: 6px; font-size: 12px; margin-bottom: 16px;"></div>

                <div class="form-group">
                  <label for="budget-total-amount">Total Monthly Budget Limit (₹) *</label>
                  <input type="number" id="budget-total-amount" class="form-control" placeholder="e.g. 20000" step="100" min="0" required>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
                <button type="submit" id="btn-save-budget" class="btn btn-primary">Save Budget</button>
              </div>
            </form>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script type="module" src="../../js/pages/budget.js"></script>
</body>
</html>
