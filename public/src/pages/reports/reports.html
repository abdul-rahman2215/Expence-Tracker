<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Smart Expense Tracker</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../../../favicon.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tabler Icons Webfont -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <!-- CSS Design System -->
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/responsive.css">

  <!-- Supabase CDN Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside id="app-sidebar"></aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Top Navbar -->
      <header id="app-navbar"></header>

      <!-- Main Content -->
      <main class="main-content">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Financial Reports</h1>
            <p class="text-muted">Generate multi-period financial summaries and export transaction data.</p>
          </div>
          
          <button id="btn-export-csv" class="btn btn-primary btn-sm">📥 Export CSV Spreadsheet</button>
        </div>

        <!-- Filter Presets Card -->
        <div class="card" style="margin-bottom: var(--space-6);">
          <div class="form-row" style="align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="report-period-preset">Report Period</label>
              <select id="report-period-preset" class="form-control">
                <option value="this_month" selected>This Month</option>
                <option value="today">Today</option>
                <option value="this_week">This Week</option>
                <option value="last_month">Last Month</option>
                <option value="custom">Custom Range</option>
              </select>
            </div>

            <!-- Custom Range Date Inputs -->
            <div id="report-custom-range" class="hidden" style="display: flex; gap: 8px; align-items: center;">
              <input type="date" id="report-start-date" class="form-control" style="width: 140px;">
              <span class="text-muted" style="font-size: 12px;">to</span>
              <input type="date" id="report-end-date" class="form-control" style="width: 140px;">
              <button id="btn-apply-report-custom" class="btn btn-secondary btn-sm">Apply</button>
            </div>
          </div>
        </div>

        <!-- Metric Summary Cards Grid -->
        <div class="metrics-grid">
          <div class="card metric-card">
            <div class="metric-header">Total Income</div>
            <div id="rep-total-income" class="metric-value text-income">₹0.00</div>
          </div>

          <div class="card metric-card">
            <div class="metric-header">Total Expenses</div>
            <div id="rep-total-expense" class="metric-value text-expense">₹0.00</div>
          </div>

          <div class="card metric-card">
            <div class="metric-header">Net Savings</div>
            <div id="rep-net-savings" class="metric-value text-savings">₹0.00</div>
          </div>

          <div class="card metric-card">
            <div class="metric-header">Top Spending Category</div>
            <div id="rep-top-category" class="metric-value" style="font-size: var(--text-lg);">-</div>
          </div>
        </div>

        <!-- Category Breakdown Table Card -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Category Summary Breakdown</h3>
          </div>
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Type</th>
                  <th>Total Amount</th>
                  <th>Percentage of Total</th>
                </tr>
              </thead>
              <tbody id="rep-category-tbody">
                <!-- Dynamically Populated -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../../js/pages/reports.js"></script>
</body>
</html>
